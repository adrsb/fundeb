# ============================
# Projeto
# Referência: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# ============================
[project]
name = "fundeb"
version = "0.1.0"
description = """Trata-se de um projeto end-to-end de engenharia, ciência e análise de 
dados do Fundeb. Aqui você encontrará desde a extração e transformação dos dados 
brutos até a análise e visualização dos mesmos com geração automática de relatórios,
apresentações e dashboards."""
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
readme = "README.md"
authors = [
    { name = "adrsb", email = "adrian.sbar07@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["fundeb", "educação", "dados", "data engineering", "data science", "data analysis"]
dependencies = [
    "ipykernel>=7.1.0",
    "pandas>=2.3.3",
    "pandera>=0.26.1",
    "prefect>=3.6.3",
    "pyarrow>=22.0.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = []

[project.urls]
Repository = "https://github.com/adrsb/fundeb.git"

[project.scripts]
flows = "fundeb.main:main"

# ============================
# Build e Setuptools
# ============================
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Informa ao setuptools para encontrar os pacotes dentro da pasta 'src'.
# Essencial para a estrutura de layout com 'src/'.
where = ["src"]

[tool.setuptools]
# Mapeia o diretório raiz de pacotes para 'src'.
package-dir = { "" = "src" }
